_format_version: "3.0"
_info:
  select_tags: [shop]
services:
  - name: orders
    url: http://orders.internal:8081
    read_timeout: 30000
    plugins:
      - name: cors
        config:
          origins: ["*"]
    routes:
      - name: list
        paths: [/orders]
        methods: [GET, POST]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]
          - name: acl
            config:
              allow: [CUSTOMER]
          - name: rate-limiting
            config:
              minute: 20
              limit_by: consumer
              fault_tolerant: false
      - name: catalog
        paths: [/catalog/]
        methods: [GET]
        strip_path: false
        preserve_host: true
        plugins:
          - name: jwt
            config:
              anonymous: guest
      - name: legacy
        paths: [/v1/orders]
        methods: [GET]
routes:
  - name: status
    service:
      name: orders
    paths: [/status]
    methods: [GET]
    strip_path: false
plugins:
  - name: prometheus
  - name: request-size-limiting
    route: list
    config:
      allowed_payload_size: 4
      size_unit: kilobytes
  - name: correlation-id
    route: status
consumers:
